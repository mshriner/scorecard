version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/' 
    schedule:
      interval: 'weekly'
    groups:
      compiler-cli:
        patterns:
          - '@angular/compiler-cli'
        update-types:
          - 'minor'
          - 'patch'
      angular-dependencies:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'typescript'
        exclude-patterns:
          - '@angular/compiler-cli'
        update-types:
          - 'minor'
          - 'patch'
      dev-dependencies:
        dependency-type: 'development'
        exclude-patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'typescript'