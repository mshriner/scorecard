<h2 mat-dialog-title>Add New Profile</h2>
<mat-dialog-content>
  <mat-form-field
    class="hundred-percent-input"
    (keyup.enter)="handleEnterKey()"
  >
    <mat-label>Profile Name</mat-label>
    <input matInput [(ngModel)]="profileName" cdkFocusInitial />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions class="no-padding actions-center">
  <button mat-stroked-button (click)="onNoClick()">
    <mat-icon>cancel</mat-icon>
    Cancel
  </button>
  <button
    mat-stroked-button
    [disabled]="!profileName()?.length"
    [mat-dialog-close]="profileName()"
  >
    <mat-icon>save</mat-icon>
    Save
  </button>
</mat-dialog-actions>
